<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/src/styles.css"></head>
<body class="center">
<button class="back-btn" onclick="history.back()"> Back</button>
<h2>Choose Specialist</h2>
<div class="specialist-grid">
  <div class="specialist-card">
    <img src="/assets/image1.png"><h4>Dr. A Sharma</h4><p>499</p>
    <button class="btn-book" onclick="selectSpec('Dr. A Sharma',499)">Book</button>
  </div>
  <div class="specialist-card">
    <img src="/assets/image2.png"><h4>Dr. R Mehta</h4><p>699</p>
    <button class="btn-book" onclick="selectSpec('Dr. R Mehta',699)">Book</button>
  </div>
  <div class="specialist-card">
    <img src="/assets/image3.png"><h4>Dr. P Iyer</h4><p>899</p>
    <button class="btn-book" onclick="selectSpec('Dr. P Iyer',899)">Book</button>
  </div>
</div>
<script>
function selectSpec(name,price){
 localStorage.setItem('selectedSpecialist', JSON.stringify({name,price}));
 location.href='/src/patient.html';
}
</script>
</body></html>

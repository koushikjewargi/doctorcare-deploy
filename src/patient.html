<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body class="center">

<button class="back-btn" onclick="history.back()">Back</button>

<div class="form">
  <h2>Patient Details</h2>

  <div class="form-group">
    <label>Full Name</label>
    <input id="name">
    <small id="ne" class="error"></small>
  </div>

  <div class="form-group">
    <label>Age</label>
    <input id="age" type="number">
    <small id="ae" class="error"></small>
  </div>

  <div class="form-group">
    <label>Address</label>
    <textarea id="address"></textarea>
    <small id="ad" class="error"></small>
  </div>

  <button id="payBtn" type="button" class="btn-book">
    Continue to Payment
  </button>
</div>

<script>
document.getElementById('payBtn').addEventListener('click', function () {
  const nameInput = document.getElementById('name');
  const ageInput = document.getElementById('age');
  const addressInput = document.getElementById('address');

  const ne = document.getElementById('ne');
  const ae = document.getElementById('ae');
  const ad = document.getElementById('ad');

  const n = nameInput.value.trim();
  const a = ageInput.value.trim();
  const addr = addressInput.value.trim();

  ne.innerText = n ? '' : 'Name required';
  ae.innerText = a ? '' : 'Age required';
  ad.innerText = addr ? '' : 'Address required';

  if (n && a && addr) {
    window.location.href = "/src/payment.html";   // working redirect
  }
});
</script>

</body>
</html>

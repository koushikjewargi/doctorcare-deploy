<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="center">

<h2>Booking History</h2>
<div id="history"></div>

<a class="btn-book" href="index.html">Back Home</a>

<script>
  const historyDiv = document.getElementById("history");
  const bookings = JSON.parse(localStorage.getItem("bookings") || "[]");

  if (bookings.length === 0) {
    historyDiv.innerHTML = "<p>No bookings yet</p>";
  } else {
    historyDiv.innerHTML = bookings.map(b => `
      <div class="form" style="margin-bottom:12px;">
        <p><b>ID:</b> ${b.id}</p>
        <p><b>Date:</b> ${b.date}</p>
        <p><b>Status:</b> <span id="status-${b.id}">${b.status}</span></p>
        <button class="btn-book" onclick="cancelBooking(${b.id})">Cancel Booking</button>
      </div>
    `).join("");
  }

  function cancelBooking(id) {
    const updated = bookings.map(b => {
      if (b.id === id) {
        b.status = "CANCELLED";
        b.payment = "REFUND INITIATED";
      }
      return b;
    });

    localStorage.setItem("bookings", JSON.stringify(updated));
    alert("Booking cancelled successfully");
    location.reload();
  }
</script>

</body>
</html>

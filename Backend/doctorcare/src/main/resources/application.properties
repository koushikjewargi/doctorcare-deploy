spring.application.name=doctorcare

# Run backend on port 8080 (React is on 3000)
server.port=8080

# Connect to your local MongoDB (from your Compass screenshot)
spring.data.mongodb.uri=mongodb://localhost:27017/doctor_db
spring.data.mongodb.database=doctor_db

# Security Key for JWT (We will use this later for login)
jwt.secret=FouriseDoctorAppSuperSecretKeyForSecurityDoNotShare
jwt.expiration=86400000